<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#001122"/>
      <stop offset="100%" stop-color="#000033"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  

  
  <!-- Cercle extérieur bleu -->
  <circle cx="400" cy="400" r="390" fill="none" stroke="url(#ring)" stroke-width="20" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="380" fill="none" stroke="url(#ring)" stroke-width="2"/>
  
  <!-- Icônes en haut -->
  <g transform="translate(200, 120)">
    <!-- Icône de recyclage -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#00a8ff" stroke-width="4"/>
    <path d="M-25,-10 L0,20 L25,-10" stroke="#00a8ff" stroke-width="4" fill="none"/>
    <path d="M-20,5 L0,-25 L20,5" stroke="#00a8ff" stroke-width="4" fill="none"/>
  </g>
  
  <g transform="translate(600, 120)">
    <!-- Icône de remorquage (crochet) -->
    <rect x="-40" y="-15" width="80" height="30" rx="5" fill="none" stroke="#00a8ff" stroke-width="4"/>
    <path d="M-20,-15 Q0,-40 20,-15 Q0,-10 0,15 Q0,25 -20,15" stroke="#00a8ff" stroke-width="4" fill="none"/>
  </g>
  
  <!-- Texte principal -->
  <text x="400" y="280" font-family="Arial Black, Arial, sans-serif" font-size="60" font-weight="900" fill="#00a8ff" text-anchor="middle" letter-spacing="2">ÉPAVISTE &</text>
  <text x="400" y="350" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">DÉPANNAGE</text>
  <text x="400" y="420" font-family="Arial Black, Arial, sans-serif" font-size="80" font-weight="900" fill="#00a8ff" text-anchor="middle" letter-spacing="1">72</text>
  
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="3">LE MANS</text>
  
  <text x="400" y="530" font-family="Arial, sans-serif" font-size="18" fill="#888" text-anchor="middle" letter-spacing="1">ÉPAVISTE AGRÉÉ · DÉPANNAGE · REMORQUAGE</text>
  
  <text x="400" y="580" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#00a8ff" text-anchor="middle">📞 07 66 27 48 53</text>
  
  <text x="400" y="630" font-family="Arial, sans-serif" font-size="16" fill="#666" text-anchor="middle">La Sarthe - Le Mans</text>
  
  <text x="400" y="670" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">À votre service 7j/7</text>
  
  <!-- Camion de dépannage stylisé -->
  <g transform="translate(150, 200)" opacity="0.3">
    <rect x="50" y="150" width="200" height="80" rx="10" fill="none" stroke="#00a8ff" stroke-width="3"/>
    <rect x="60" y="140" width="180" height="60" fill="#111" opacity="0.8"/>
    <circle cx="100" cy="230" r="25" fill="#333"/>
    <circle cx="250" cy="230" r="25" fill="#333"/>
    <rect x="120" y="100" width="150" height="40" fill="#222" opacity="0.7"/>
  </g>
  
  <!-- Voiture accidentée stylisée -->
  <g transform="translate(450, 220)" opacity="0.3">
    <ellipse cx="100" cy="100" rx="60" ry="30" fill="none" stroke="#00a8ff" stroke-width="3"/>
    <rect x="40" y="70" width="120" height="60" rx="10" fill="#333" opacity="0.8"/>
    <circle cx="60" cy="130" r="15" fill="#333"/>
    <circle cx="140" cy="130" r="15" fill="#333"/>
  </g>
</svg>
